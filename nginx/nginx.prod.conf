upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:5000;
}

# Decide which requests count as meaningful application activity.
#
# 1 = write to app_activity.log
# 0 = do not write to app_activity.log
map $uri $log_mockstreet_activity {
    default                   1;
    /api/health/ready         0;
}

log_format mockstreet_activity
    '$time_iso8601 $remote_addr "$request" '
    '$status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

# The `if` parameter controls only this dedicated activity log.
access_log /var/log/mockstreet/app_activity.log
    mockstreet_activity
    if=$log_mockstreet_activity;

server {
    listen 80;
    server_name
        mockstreetexchange.com
        www.mockstreetexchange.com
        origin.mockstreetexchange.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}