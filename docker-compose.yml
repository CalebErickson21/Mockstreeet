# Local development PostgreSQL only.
# Frontend and backend run with npm on the host (see README).
# Production: Vercel + Render (not this file).
#
# Credentials come from root `.env` (see `.env.example`). Defaults match that file.

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: mockstreet-db
        ports:
            # Host 5433 avoids conflict with a local Postgres already on 5432
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
