# Local development PostgreSQL (and shared base for staging overlay).
# Day-to-day: run frontend + backend with npm on the host.
# Staging QA: docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
            POSTGRES_DB: ${POSTGRES_DB:-}
        ports:
            # Host 5433 avoids conflict with a local Postgres already on 5432
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mockstreet -d mockstreet"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
