# Staging / QA stack - production-like containers before Vercel + Render.
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build
#
# Not for day-to-day coding (use npm on the host). Not deployed to production.

services:
    backend:
        build:
            context: ./backend
            target: prod
        ports:
            - "5000:5000"
        environment:
            NODE_ENV: production
            PORT: 5000
            DATABASE_URL: postgresql://mockstreet:mockstreet@postgres:5432/mockstreet
            SESSION_SECRET: ${SESSION_SECRET:-staging-session-secret-not-for-production}
            ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
            # Local HTTP staging cannot use Secure cookies; real Render prod omits this
            COOKIE_SECURE: "false"
            EMAIL_USER: ${EMAIL_USER:-}
            EMAIL_PASS: ${EMAIL_PASS:-}
            FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
        command: sh -c "npm run migrate && node index.js"
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            args:
                VITE_API_URL: http://localhost:5000
        ports:
            - "3000:3000"
        depends_on:
            - backend
        restart: unless-stopped
